<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin paneli — CV ghostlayanlar</title>
    <link rel="stylesheet" href="/admin.css?v=1" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <div class="eyebrow">CV GHOSTLAYANLAR</div>
          <h1>Admin paneli</h1>
          <p>İlanları ve spam raporlarını buradan yönetebilirsiniz.</p>
        </div>
        <a class="back-link" href="/">← Uygulamaya dön</a>
      </header>
      <section class="login-panel" id="login-panel">
        <h2>Admin girişi</h2>
        <p>Yönetim paneline erişmek için kullanıcı adı, şifre ve authenticator kodu gerekir.</p>
        <form id="login-form"><label>Kullanıcı adı<input name="username" autocomplete="username" required /></label><label>Şifre<input name="password" type="password" autocomplete="current-password" required /></label><button class="primary-button" type="submit">Devam et</button></form>
        <form class="hidden" id="twofa-form"><label>6 haneli 2FA kodu<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required /></label><button class="primary-button" type="submit">Panele gir</button></form>
        <div class="login-error hidden" id="login-error"></div>
      </section>
      <div class="hidden" id="admin-app">
        <section class="admin-toolbar"><section class="admin-warning"><strong>Yönetici alanı</strong><span>İlan silme işlemi bağlı gönderimleri ve raporları da kaldırır.</span></section><button class="logout-button" id="logout-button">Çıkış yap</button></section>
        <section class="admin-summary" id="admin-summary"></section>
        <section class="admin-list" id="admin-list"><div class="loading">İlanlar yükleniyor…</div></section>
      </div>
    </main>
    <script src="/admin.js?v=1"></script>
  </body>
</html>
